name: Build and Push Docker Image

# Gitea Actions 专用：触发目录为 .gitea/workflows（GitHub 的 .github/workflows 不会被 Gitea 读取）
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# 同一分支/标签连续推送只保留最新一次构建
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gitea 内置容器 registry 地址（与站点同域）
  REGISTRY: git.pyss.cn:4430

jobs:
  build_and_push:
    # 按你 act_runner 注册时使用的标签填写，默认是 ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from config
        run: |
          VERSION=$(grep "version:" public/js/config.js | sed "s/.*'\(.*\)'.*/\1/")
          [ -z "$VERSION" ] && VERSION=latest
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
          # registry 要求镜像名全小写
          echo "IMAGE_NAME=$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Update build hash
        # 只更新构建产物，不回推 git（避免 runner 需要写仓库权限）
        continue-on-error: true
        run: node scripts/update-build-hash.js

      - name: Log in to Gitea container registry
        env:
          # 推荐在仓库 Settings → Secrets 配置；未配置时回退到 runner 内置 token
          REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER="${REGISTRY_USER:-${GITHUB_ACTOR}}"
          PASS="${REGISTRY_PASS:-${GITEA_TOKEN}}"
          echo "$PASS" | docker login "$REGISTRY" -u "$USER" --password-stdin

      - name: Build image (linux/amd64)
        run: |
          docker build \
            -f Dockerfile \
            -t "$REGISTRY/$IMAGE_NAME:${SHORT_SHA}" \
            -t "$REGISTRY/$IMAGE_NAME:latest" \
            -t "$REGISTRY/$IMAGE_NAME:${PROJECT_VERSION}" \
            .

      - name: Push image
        run: |
          docker push "$REGISTRY/$IMAGE_NAME:${SHORT_SHA}"
          docker push "$REGISTRY/$IMAGE_NAME:latest"
          docker push "$REGISTRY/$IMAGE_NAME:${PROJECT_VERSION}"

      - name: Logout
        if: always()
        run: docker logout "$REGISTRY" || true
